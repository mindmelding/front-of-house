name: canon
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Overlay stays private (only the README and templates are tracked)
        run: |
          bad=$(git ls-files overlay | grep -Ev '^overlay/(README\.md|[^/]+\.template\.md|mcp\.template\.json)$' || true)
          if [ -n "$bad" ]; then echo "private overlay file(s) tracked in the canon:"; echo "$bad"; exit 1; fi
      - name: Lexicon check (the canon eats its own cooking)
        run: python3 scripts/fohcheck.py --repo
      - name: Adapters are fresh
        run: python3 scripts/build_adapters.py --check
      - name: Every moment has an eval
        run: |
          missing=0
          for d in moments/*/; do
            m=$(basename "$d")
            if ! grep -rl "^moment: $m" evals/cases/ >/dev/null 2>&1; then
              echo "no eval case for moment: $m"; missing=1
            fi
          done
          exit $missing
      - name: Engine smoke test (scratch overlay, anonymization audit)
        run: |
          export FOH_OVERLAY=$(mktemp -d)
          E() { python3 scripts/engine.py "$@"; }
          E alias add "Example Customer Inc" --kind account
          E alias add "Jane Example" --kind person --org "Example Customer Inc"
          E house init
          E house add refund-or-credit "Jane Example at Example Customer Inc gets the number first" --evidence 2 --confirmed
          E queue add --moment silence --kind rule --text "A heads-down statement sets a quiet clock" --evidence 2
          E queue decide $(date +%Y-%m-%d)-01 approve
          E drill next --n 3
          git config --global user.email ci@example.com && git config --global user.name ci
          E sync init && E sync now --no-push && E sync status
          E alias audit
          ! grep -rqi "Example Customer Inc\|Jane Example" "$FOH_OVERLAY/house" "$FOH_OVERLAY/queue"
